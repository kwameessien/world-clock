<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var s = localStorage.getItem('world-clock-settings');
        var p = s ? JSON.parse(s) : {};
        var dark = p.theme ? p.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (_) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A world clock you read: every city on one 24-hour dial, a table for finding a time to meet, and the time written out in words." />
    <link rel="manifest" href="/manifest.json" />
    <title>World Clock</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clock.kwame.co/" />
    <meta property="og:title" content="World Clock" />
    <meta property="og:description" content="A world clock you read: every city on one 24-hour dial, a table for finding a time to meet, and the time written out in words." />
    <meta property="og:image" content="https://clock.kwame.co/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="World Clock: A clock you read, not a dashboard you scan. Every city on one 24-hour dial." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="World Clock" />
    <meta name="twitter:description" content="A world clock you read: every city on one 24-hour dial, a table for finding a time to meet, and the time written out in words." />
    <meta name="twitter:image" content="https://clock.kwame.co/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
