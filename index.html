<!doctype html>
<html lang="en">
  <head>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var s = localStorage.getItem('world-clock-settings');
        var p = s ? JSON.parse(s) : {};
        var dark = p.theme ? p.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (_) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/clock.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F2F0EB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A world clock you read: every city on one 24-hour dial, a table for finding a time to meet, and the time written out in words." />
    <link rel="manifest" href="/manifest.json" />
    <title>World Clock</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
